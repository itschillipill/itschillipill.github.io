<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A showcase of my projects">
  
  <title>My Projects</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    /* Основные стили страницы */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    /* Контейнер */
    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    /* Заголовок */
    h1 {
      margin-bottom: 30px;
      font-size: 2.2em;
      letter-spacing: 1px;
      color: #222;
    }

    /* Список проектов */
    .project-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .project-list li {
      margin: 15px 0;
    }

    .project-list a {
      text-decoration: none;
      color: #007BFF;
      font-size: 1.2em;
      font-weight: 600;
      padding: 10px 20px;
      display: inline-block;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .project-list a:hover {
      background-color: #007BFF;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Projects</h1>
    <ul class="project-list">
      <li><a href="caesar-encryptor/index.html">Caesar Encryptor</a></li>
      <li><a href="bolshoy_sad/index.html">Bolshoy Sad</a></li>
      <li><a href="planet-chat/index.html">Planet Chat</a></li>
      <li><a href="BookStore-Plus/index.html">BookStore Plus</a></li>
    </ul>
  </div>
</body>
</html>
